<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080A" />
    <meta
      name="description"
      content="DevRats é a plataforma de constância para desenvolvedores: conecte o GitHub, desafie amigos e prove sua sequência em dias válidos."
    />
    <meta property="og:title" content="DevRats - Constância que compila" />
    <meta
      property="og:description"
      content="Desafios privados entre devs com verificação automática de commits no GitHub. Streaks, ranking e calendário de atividade."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevRats" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://devrats-web.vercel.app" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevRats - Constância que compila" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevRats - Constância que compila" />
    <meta
      name="twitter:description"
      content="Desafios privados entre devs com verificação automática de commits no GitHub. Streaks, ranking e calendário de atividade."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>DevRats - Constância que compila</title>
    <script>
      try {
        var stored = localStorage.getItem('ds-theme');
        var light = stored === 'light';
        document.documentElement.classList.toggle('light', light);
        document.documentElement.classList.toggle('dark', !light);
        document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
